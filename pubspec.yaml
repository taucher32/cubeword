name: cubeword
description: A Flutter cube word game.

publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/words_tr.txt
    - assets/words_en.txt
    - assets/sounds/

